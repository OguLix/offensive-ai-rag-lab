[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragbot"
version = "0.1.0"
description = "Local RAG chatbot used as a red-teaming target for the Keamanan Informasi final project"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "ollama",
    "chromadb",
    "flask",
    "pyyaml",
    "python-dotenv",
    "pandas",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
# "." dan "src" dipakai agar isort mengenali `app` (root) dan `ragbot` (src layout)
# sebagai first-party, bukan third-party.
src = [".", "src"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# "src" dan "." dipakai agar `ragbot` dan paket `app` bisa diimpor tanpa
# `pip install -e .`, sehingga smoke test Fase 0 tetap bisa dijalankan.
pythonpath = [".", "src"]
addopts = "-ra"
markers = [
    "integration: butuh Ollama berjalan di localhost; tidak dijalankan secara default",
]
