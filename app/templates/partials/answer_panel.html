<section
  id="answer-panel"
  class="answer-panel"
  data-state="empty"
  aria-live="polite"
  aria-busy="false"
>
  <p id="answer-meta" class="answer-meta" hidden></p>

  <div id="answer-card" class="answer-card">
    <h3 id="answer-title" class="answer-title">Belum ada jawaban</h3>

    <div id="answer-progress" class="progress" hidden>
      <span></span>
    </div>

    <p id="answer-status" class="answer-status" hidden></p>

    <p id="answer-body" class="answer-body">
      Atur kondisi uji di bawah, tulis pertanyaan, lalu tekan tombol kirim.
    </p>
  </div>

  <div class="answer-actions">
    <button id="answer-action" class="button-outline" type="button" hidden>
      Kirim ulang
    </button>
  </div>
</section>
