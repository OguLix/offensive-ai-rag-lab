<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}RAG Red Team Lab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <h1 class="brand-heading">
      <a class="brand" href="{{ url_for('main.index') }}">RAG Red Team Lab</a>
    </h1>
    <div class="topbar-meta">
      <p class="topbar-model">model: <span id="model-name">memuat...</span></p>
    </div>
  </header>

  <main class="app-shell">
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
