# Satu-satunya sumber konfigurasi runtime (AGENTS.md Bagian 4 dan 11).
# Kode tidak boleh menyimpan nama model sendiri; ganti model hanya di sini.

# LLM lokal lewat Ollama (kelas 3B-8B terkuantisasi), disepakati tim
# (docs/decisions.md). Siapkan dengan `ollama pull` untuk kedua model.
chat_model: "llama3.2:3b"
embedding_model: "nomic-embed-text"

# Generasi: temperature 0 dan seed tetap supaya percobaan bisa diulang.
temperature: 0.0
seed: 0

# Retrieval: jumlah chunk yang diambil per pertanyaan.
retrieval_k: 4

# Path relatif terhadap root repo.
chroma_db_path: "chroma_db"
logs_path: "logs"

# Koleksi vektor. kb_clean tidak pernah ditimpa (AGENTS.md Bagian 6);
# daftar ini juga menjadi whitelist di app/routes.py.
default_collection: "kb_clean"
allowed_collections:
  - "kb_clean"
  - "kb_poisoned"
  - "kb_poisoned_sanitized"

# Aplikasi Flask hanya untuk loopback. Jangan diganti ke 0.0.0.0 (Bagian 10.3).
app_host: "127.0.0.1"
app_port: 5000
max_question_chars: 2000
